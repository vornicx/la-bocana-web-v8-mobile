name: Ship La Bocana demo video

on:
  push:
    branches:
      - agent/la-bocana-demo-upload
    paths:
      - .tmp/ship-demo.trigger

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/la-bocana-demo-upload
          fetch-depth: 0

      - name: Ensure ffmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Recover and validate the original Control demo
        shell: python
        run: |
          import base64
          import glob
          import re
          import subprocess
          from pathlib import Path

          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          source = subprocess.check_output(
              ['git', 'show', 'origin/main:components/admin/demo-video-data/part-00.ts'],
              text=True,
          )
          match = re.fullmatch(r"export default '([^']*)';\s*", source, re.S)
          if not match:
              raise SystemExit('Could not read the first demo-video chunk from main')

          first = match.group(1)
          parts = sorted(glob.glob('.tmp/demo-video/part-*.b64'))
          if not parts:
              raise SystemExit('No continuation chunks found on upload branch')

          tail = ''.join(Path(path).read_text(encoding='utf-8') for path in parts)
          encoded = ''.join((first + tail).split())
          print(f'Collected {len(encoded)} base64 characters from {1 + len(parts)} chunks')

          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          selected = None
          diagnostics = []

          for char in alphabet:
              candidate = encoded + char
              candidate += '=' * ((4 - len(candidate) % 4) % 4)
              try:
                  data = base64.b64decode(candidate, validate=True)
              except Exception:
                  continue
              if not data.startswith(bytes.fromhex('1a45dfa3')):
                  continue

              path = Path(f'/tmp/demo-candidate-{ord(char)}.webm')
              path.write_bytes(data)
              probe = subprocess.run(
                  ['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'default=noprint_wrappers=1:nokey=1', str(path)],
                  capture_output=True,
                  text=True,
              )
              try:
                  duration = float(probe.stdout.strip())
              except Exception:
                  duration = 0.0

              decode = subprocess.run(
                  ['ffmpeg', '-v', 'error', '-i', str(path), '-map', '0:v:0', '-f', 'null', '-'],
                  capture_output=True,
                  text=True,
              )
              diagnostics.append((char, duration, decode.returncode, decode.stderr[-300:]))
              if 90 <= duration <= 100 and decode.returncode == 0:
                  selected = path
                  print(f'Recovered playable WebM with duration {duration:.3f}s')
                  break

          if selected is None:
              print('Recovery diagnostics:')
              for item in diagnostics[:12]:
                  print(item)
              raise SystemExit('Could not recover a fully decodable Control demo from staged chunks')

          output = Path('/tmp/demo-la-bocana.mp4')
          subprocess.run(
              ['ffmpeg', '-y', '-v', 'error', '-i', str(selected), '-map', '0:v:0', '-map', '0:a?', '-c:v', 'libx264', '-preset', 'medium', '-crf', '24', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '128k', '-movflags', '+faststart', str(output)],
              check=True,
          )
          size = output.stat().st_size
          duration = float(subprocess.check_output(
              ['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'default=noprint_wrappers=1:nokey=1', str(output)],
              text=True,
          ).strip())
          if size < 50_000 or not (90 <= duration <= 100):
              raise SystemExit(f'Unexpected recovered MP4: size={size}, duration={duration}')
          print(f'Native MP4 ready: {size} bytes, {duration:.3f}s')

      - name: Switch to current main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git clean -fdx
          mkdir -p public/videos components/admin
          cp /tmp/demo-la-bocana.mp4 public/videos/demo-la-bocana.mp4

      - name: Add native inline player
        run: |
          cat > components/admin/control-demo-video.tsx <<'TSX'
          export function ControlDemoVideo() {
            return (
              <div className="control-demo-access control-demo-video-card" aria-label="Vídeo de demostración de Control">
                <div className="control-demo-access-head">
                  <div>
                    <span>Vídeo de demostración</span>
                    <strong>Mira cómo funciona Control antes de entrar</strong>
                  </div>
                  <span className="control-demo-badge">1:34</span>
                </div>
                <p className="control-demo-video-copy">Un recorrido breve por reservas, sala, clientes y la operativa diaria de La Bocana.</p>
                <div className="control-native-video-frame">
                  <video className="control-native-video" src="/videos/demo-la-bocana.mp4" controls playsInline preload="metadata">
                    Tu navegador no puede reproducir este vídeo.
                  </video>
                </div>
                <p className="control-native-video-note">Reproducción directa en La Bocana · sin salir de la web</p>
              </div>
            );
          }
          TSX

          if ! grep -q "Native Control demo video" app/admin-login/demo-access.css; then
            cat >> app/admin-login/demo-access.css <<'CSS'

          /* Native Control demo video */
          .control-native-video-frame {
            width: 100%;
            margin-top: 14px;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 14px;
            background: #07151e;
            border: 1px solid rgba(16, 43, 61, 0.12);
            box-shadow: 0 14px 34px rgba(7, 21, 30, 0.14);
          }

          .control-native-video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #07151e;
          }

          .control-native-video-note {
            margin: 10px 0 0;
            color: rgba(16, 43, 61, 0.58);
            font-size: 11px;
            line-height: 1.45;
            letter-spacing: 0.015em;
          }

          @media (max-width: 640px) {
            .control-native-video-frame {
              margin-top: 12px;
              border-radius: 11px;
            }

            .control-native-video-note {
              font-size: 10px;
            }
          }
          CSS
          fi

      - name: Replace Canva link with native player
        shell: python
        run: |
          from pathlib import Path

          login = Path('app/admin-login/login-form.tsx')
          text = login.read_text(encoding='utf-8')
          text = text.replace("const DEMO_VIDEO_URL = 'https://www.canva.com/d/oaEej4P36GJOBoT';\n", '')

          import_line = "import { ControlDemoVideo } from '@/components/admin/control-demo-video';\n"
          anchor = "import { loginStaff, type LoginState } from './actions';\n"
          if import_line not in text:
              if anchor not in text:
                  raise SystemExit('Could not locate login-form import anchor')
              text = text.replace(anchor, anchor + import_line)

          old = '''      <div className="control-demo-access control-demo-video-card" aria-label="Vídeo de demostración de Control">
                  <div className="control-demo-access-head">
                    <div>
                      <span>Vídeo de demostración</span>
                      <strong>Mira cómo funciona Control antes de entrar</strong>
                    </div>
                    <span className="control-demo-badge">1:34</span>
                  </div>
                  <p className="control-demo-video-copy">Un recorrido breve por reservas, sala, clientes y la operativa diaria de La Bocana.</p>
                  <a className="control-demo-use" href={DEMO_VIDEO_URL} target="_blank" rel="noreferrer">
                    Ver demostración
                    <span aria-hidden="true">→</span>
                  </a>
                </div>'''
          if old not in text:
              old = old.replace('                  ', '        ')
          if old not in text:
              raise SystemExit('Could not locate the Canva video card in login-form.tsx')
          text = text.replace(old, '      <ControlDemoVideo />')
          login.write_text(text, encoding='utf-8')

      - name: Verify native integration
        run: |
          if grep -R "canva.com/d/oaEej4P36GJOBoT" app components; then
            echo "Canva demo URL is still referenced"
            exit 1
          fi
          test -s public/videos/demo-la-bocana.mp4
          npm ci
          npm run build

      - name: Commit and push directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/demo-la-bocana.mp4 components/admin/control-demo-video.tsx app/admin-login/login-form.tsx app/admin-login/demo-access.css
          git commit -m "embed La Bocana Control demo video natively"
          git push origin main
