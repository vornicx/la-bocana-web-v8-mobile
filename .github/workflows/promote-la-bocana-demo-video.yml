name: Promote La Bocana demo video

on:
  push:
    branches:
      - agent/la-bocana-demo-upload

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify demo asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/lb-promote/public/videos
          mkdir -p /tmp/lb-promote/components/admin
          mkdir -p /tmp/lb-promote/app/admin-login

          cat .tmp/demo-video/part-*.b64 | base64 --decode > /tmp/lb-promote/public/videos/demo-la-bocana.mp4

          test "$(stat -c%s /tmp/lb-promote/public/videos/demo-la-bocana.mp4)" -eq 1199925
          echo "eefe7471d6f9ef590a8c3c260df1d1d8cc5d4f2fa1ebfb63b903869e2d7f237c  /tmp/lb-promote/public/videos/demo-la-bocana.mp4" | sha256sum --check --strict

          cp components/admin/control-demo-video.tsx /tmp/lb-promote/components/admin/control-demo-video.tsx
          cp components/admin/control-demo-video.module.css /tmp/lb-promote/components/admin/control-demo-video.module.css
          cp components/admin/admin-shell.tsx /tmp/lb-promote/components/admin/admin-shell.tsx
          cp app/admin-login/login-form.tsx /tmp/lb-promote/app/admin-login/login-form.tsx

      - name: Promote once to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

          mkdir -p public/videos components/admin app/admin-login
          cp /tmp/lb-promote/public/videos/demo-la-bocana.mp4 public/videos/demo-la-bocana.mp4
          cp /tmp/lb-promote/components/admin/control-demo-video.tsx components/admin/control-demo-video.tsx
          cp /tmp/lb-promote/components/admin/control-demo-video.module.css components/admin/control-demo-video.module.css
          cp /tmp/lb-promote/components/admin/admin-shell.tsx components/admin/admin-shell.tsx
          cp /tmp/lb-promote/app/admin-login/login-form.tsx app/admin-login/login-form.tsx

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/demo-la-bocana.mp4 \
            components/admin/control-demo-video.tsx \
            components/admin/control-demo-video.module.css \
            components/admin/admin-shell.tsx \
            app/admin-login/login-form.tsx

          if git diff --cached --quiet; then
            echo "Main already contains the demo experience."
            exit 0
          fi

          git commit -m "add La Bocana Control demo video"
          git push origin main
