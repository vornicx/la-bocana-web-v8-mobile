name: Archic visual audit suite

on:
  push:
    branches: [fix/design-hardening-20260814]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUDIT_OUT: artifacts/playwright-audit-after
      SUITE_OUT: artifacts/archic-visual-audit
      SUITE_WORKSPACE: audit-workspace
      BASE_URL: https://labocana-git-fix-design-hardening-aa4079-vornicx-7872s-projects.vercel.app
      VERCEL_SHARE_TOKEN: h0LSTlO6tSAbgJzmuwjau6x4u59Blb8H
      QA_BROKER_URL: https://rjaeqcrtxzonxqhzfxtq.supabase.co/functions/v1/qa-auth-broker
      AUDIT_DEPLOYMENT_MODE: pull-request-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Acquire ephemeral La Bocana QA login
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=labocana-qa")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -er '.value')"
          CREDS="$(curl -fsSL -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'content-type: application/json' "${QA_BROKER_URL}")"
          EMAIL="$(printf '%s' "$CREDS" | jq -er '.email')"
          PASSWORD="$(printf '%s' "$CREDS" | jq -er '.password')"
          echo "::add-mask::${EMAIL}"
          echo "::add-mask::${PASSWORD}"
          printf 'CONTROL_EMAIL=%s\n' "$EMAIL" >> "$GITHUB_ENV"
          printf 'CONTROL_PASSWORD=%s\n' "$PASSWORD" >> "$GITHUB_ENV"
      - name: Wait for protected preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            if curl -fsSL -o /dev/null "${BASE_URL}/?_vercel_share=${VERCEL_SHARE_TOKEN}"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Capture La Bocana Control preview
        run: node scripts/playwright-control-auth-audit.mjs
      - name: Clone corrected public projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-workspace
          git clone --depth 1 --branch fix/design-hardening-20260814 https://github.com/vornicx/mfinity-premium.git audit-workspace/mfinity
          git clone --depth 1 --branch fix/design-hardening-20260814 https://github.com/vornicx/marbellaboatcharter.git audit-workspace/marbella-boat-charter
          git clone --depth 1 --branch fix/design-hardening-20260814 https://github.com/vornicx/zusto-cafe-v2-final.git audit-workspace/zusto-cafe
          git clone --depth 1 --branch fix/design-hardening-20260814 https://github.com/vornicx/amer-samer-phase11.git audit-workspace/samer-barber-shop
          git clone --depth 1 --branch fix/design-hardening-20260814 https://github.com/vornicx/marbellaforsale.git audit-workspace/marbella-for-sale
      - name: Start Marbella For Sale preview locally
        shell: bash
        run: |
          set -euo pipefail
          cd audit-workspace/marbella-for-sale
          npm ci --ignore-scripts
          VERCEL=1 npm run dev -- -p 4105 > /tmp/mfs-audit.log 2>&1 &
          echo $! > /tmp/mfs-audit.pid
          for attempt in {1..60}; do
            if curl -fsS -o /dev/null http://127.0.0.1:4105/studio; then exit 0; fi
            sleep 2
          done
          cat /tmp/mfs-audit.log
          exit 1
      - name: Capture before and after for public projects
        env:
          MFS_BASE_URL: http://127.0.0.1:4105
        run: node scripts/archic-public-visual-audit.mjs
      - name: Invalidate La Bocana QA login
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=labocana-qa")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -er '.value')"
          curl -fsSL -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'content-type: application/json' "${QA_BROKER_URL}" >/dev/null
      - name: Upload visual audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archic-visual-audit-${{ github.run_number }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
