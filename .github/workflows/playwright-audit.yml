name: Playwright production audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: playwright-production-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Browser audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://labocana.vercel.app
      AUDIT_OUT: artifacts/playwright-audit
      CONTROL_EMAIL: ${{ secrets.LB_QA_CONTROL_EMAIL }}
      CONTROL_PASSWORD: ${{ secrets.LB_QA_CONTROL_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for this commit on Vercel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..36}; do
            STATUS_JSON="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" || true)"
            VERCEL_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[]? | select(.context == "Vercel")][0].state // "pending"' 2>/dev/null || echo pending)"
            echo "Vercel state: ${VERCEL_STATE}"
            if [ "$VERCEL_STATE" = "success" ]; then
              curl -fsS -o /dev/null -H 'cache-control: no-cache' "${BASE_URL}/?audit=${GITHUB_SHA}"
              exit 0
            fi
            if [ "$VERCEL_STATE" = "failure" ] || [ "$VERCEL_STATE" = "error" ]; then
              echo "Vercel failed for ${GITHUB_SHA}."
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for the production deployment."
          exit 1
      - name: Run Playwright audit v2
        run: node scripts/playwright-audit-v2.mjs
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-audit-${{ github.run_number }}
          path: artifacts/playwright-audit
          if-no-files-found: warn
          retention-days: 14
