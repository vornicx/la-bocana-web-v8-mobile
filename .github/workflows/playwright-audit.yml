name: Playwright production audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read
  id-token: write

concurrency:
  group: playwright-production-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Browser audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://labocana.vercel.app
      AUDIT_OUT: artifacts/playwright-audit
      QA_BROKER_URL: https://rjaeqcrtxzonxqhzfxtq.supabase.co/functions/v1/qa-auth-broker
      AUDIT_DEPLOYMENT_MODE: exact-sha
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Acquire ephemeral QA login
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=labocana-qa")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -er '.value')"
          CREDS="$(curl -fsSL -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'content-type: application/json' "${QA_BROKER_URL}")"
          EMAIL="$(printf '%s' "$CREDS" | jq -er '.email')"
          PASSWORD="$(printf '%s' "$CREDS" | jq -er '.password')"
          echo "::add-mask::${EMAIL}"
          echo "::add-mask::${PASSWORD}"
          printf 'CONTROL_EMAIL=%s\n' "$EMAIL" >> "$GITHUB_ENV"
          printf 'CONTROL_PASSWORD=%s\n' "$PASSWORD" >> "$GITHUB_ENV"
          echo "Dedicated QA identity acquired; credentials are masked and ephemeral."
      - name: Resolve production deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in {1..36}; do
            STATUS_JSON="$(curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" || true)"
            VERCEL_STATE="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[]? | select(.context == "Vercel")][0].state // "pending"' 2>/dev/null || echo pending)"
            VERCEL_DESCRIPTION="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[]? | select(.context == "Vercel")][0].description // ""' 2>/dev/null || true)"
            VERCEL_TARGET="$(printf '%s' "$STATUS_JSON" | jq -r '[.statuses[]? | select(.context == "Vercel")][0].target_url // ""' 2>/dev/null || true)"
            echo "Vercel state: ${VERCEL_STATE}"
            if [ "$VERCEL_STATE" = "success" ]; then
              curl -fsS -o /dev/null -H 'cache-control: no-cache' "${BASE_URL}/?audit=${GITHUB_SHA}"
              echo 'AUDIT_DEPLOYMENT_MODE=exact-sha' >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$VERCEL_STATE" = "failure" ] || [ "$VERCEL_STATE" = "error" ]; then
              if printf '%s %s' "$VERCEL_DESCRIPTION" "$VERCEL_TARGET" | grep -Eqi 'rate.?limit|build-rate-limit'; then
                echo "Vercel is rate-limited; auditing the currently active production deployment instead."
                curl -fsS -o /dev/null -H 'cache-control: no-cache' "${BASE_URL}/?audit=current-production"
                echo 'AUDIT_DEPLOYMENT_MODE=current-production-rate-limited' >> "$GITHUB_ENV"
                exit 0
              fi
              echo "Vercel failed for ${GITHUB_SHA}: ${VERCEL_DESCRIPTION}"
              exit 1
            fi
            sleep 5
          done
          echo "Vercel status timed out; auditing the currently active production deployment."
          curl -fsS -o /dev/null -H 'cache-control: no-cache' "${BASE_URL}/?audit=current-production"
          echo 'AUDIT_DEPLOYMENT_MODE=current-production-timeout' >> "$GITHUB_ENV"
      - name: Run Playwright audit v2
        run: node scripts/playwright-audit-v2.mjs
      - name: Audit responsive image delivery
        if: always()
        run: node scripts/playwright-responsive-image-audit.mjs
      - name: Run authenticated Control audit
        if: always()
        run: node scripts/playwright-control-auth-audit.mjs
      - name: Continue authenticated mobile audit
        if: always()
        run: node scripts/playwright-control-mobile-continuation.mjs
      - name: Invalidate QA login used by this run
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=labocana-qa")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | jq -er '.value')"
          curl -fsSL -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'content-type: application/json' "${QA_BROKER_URL}" >/dev/null
          echo "QA password rotated after the audit; credentials used during this run are invalid."
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-audit-${{ github.run_number }}
          path: artifacts/playwright-audit
          if-no-files-found: warn
          retention-days: 14
